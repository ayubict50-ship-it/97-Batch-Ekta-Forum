version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: large
    steps:
      - checkout

      - run:
          name: Install Flutter
          command: |
            git clone https://github.com/flutter/flutter.git -b stable ~/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter doctor

      - run:
          name: Clear Gradle Cache Completely
          command: |
            rm -rf ~/.gradle/caches/
            rm -rf ~/.android/cache/
            mkdir -p android/gradle/wrapper
            echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-all.zip" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

      - run:
          name: Force Override AGP to 8.9.1 in Project Files
          command: |
            # রুট build.gradle ফাইলে যদি 8.4.0 বা অন্য কিছু থাকে, তাকে জোরপূর্বক 8.9.1 করে দেওয়া
            if [ -f "android/build.gradle" ]; then
              sed -i 's/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.9.1\'/g' android/build.gradle
            fi
            
            # প্রজেক্টের অন্যান্য জায়গায় বা gradle-wrapper এ ভার্সন কনফ্লিক্ট এড়ানোর জন্য সার্চ করে ফিক্স করা
            find . -name "build.gradle" -type f -exec sed -i 's/8.4.0/8.9.1/g' {} +

      - run:
          name: Install Dependencies
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter pub get

      - run:
          name: Build APK Release
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - store_artifacts:
          path: build/app/outputs/flutter-apk/
          destination: release-apk

workflows:
  version: 2
  build:
    jobs:
      - build-apk
