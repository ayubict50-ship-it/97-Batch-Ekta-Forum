version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: large
    steps:
      - checkout

      - run:
          name: Install Flutter
          command: |
            git clone https://github.com/flutter/flutter.git -b stable ~/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter doctor

      - run:
          name: Clear Gradle Cache & Force Version 8.6
          command: |
            rm -rf ~/.gradle/caches/
            mkdir -p android/gradle/wrapper
            echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-all.zip" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

      - run:
          name: Update Gradle Plugin, compileSdk, and NDK Version
          command: |
            # ১. রুট android/build.gradle এ AGP ভার্সন 8.5.0 করা
            ROOT_BUILD_GRADLE="android/build.gradle"
            if [ -f "$ROOT_BUILD_GRADLE" ]; then
              echo "Updating AGP version in $ROOT_BUILD_GRADLE to 8.5.0"
              sed -i "s/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.5.0'/" "$ROOT_BUILD_GRADLE"
            fi

            # ২. android/app/build.gradle এ compileSdk=36 এবং ndkVersion যোগ করা
            APP_BUILD_GRADLE="android/app/build.gradle"
            if [ -f "$APP_BUILD_GRADLE" ]; then
              echo "Updating compileSdk and ndkVersion in $APP_BUILD_GRADLE"
              if grep -q "compileSdk" "$APP_BUILD_GRADLE"; then
                sed -i 's/compileSdk.*/compileSdk = 36/' "$APP_BUILD_GRADLE"
              else
                sed -i '/android {/a \    compileSdk = 36' "$APP_BUILD_GRADLE"
              fi
              if grep -q "ndkVersion" "$APP_BUILD_GRADLE"; then
                sed -i 's/ndkVersion.*/ndkVersion = "28.2.13676358"/' "$APP_BUILD_GRADLE"
              else
                sed -i '/android {/a \    ndkVersion = "28.2.13676358"' "$APP_BUILD_GRADLE"
              fi
            fi

      - run:
          name: Install Dependencies
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter pub get

      - run:
          name: Build APK Without Target Flag
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - store_artifacts:
          path: build/app/outputs/flutter-apk/
          destination: release-apk

workflows:
  version: 2
  build:
    jobs:
      - build-apk
