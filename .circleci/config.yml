version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2023.08-node
    steps:
      - checkout
      - run:
          name: Install Specific Flutter Version
          command: |
            git clone https://github.com/flutter/flutter.git -b 3.24.0 --depth 1 ~/flutter
            echo 'export PATH="$PATH:$HOME/flutter/bin"' >> $BASH_ENV
            source $BASH_ENV
            flutter --version
      - run:
          name: Force Update Gradle Version to 8.6
          command: |
            WRAPPER_FILE="android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$WRAPPER_FILE" ]; then
              echo "Before update:"
              cat $WRAPPER_FILE
              # Replace any version with gradle-8.6-bin.zip or all.zip
              echo "distributionBase=GRADLE_USER_HOME" > $WRAPPER_FILE
              echo "distributionPath=wrapper/dists" >> $WRAPPER_FILE
              echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip" >> $WRAPPER_FILE
              echo "zipStoreBase=GRADLE_USER_HOME" >> $WRAPPER_FILE
              echo "zipStorePath=wrapper/dists" >> $WRAPPER_FILE
              echo "After update:"
              cat $WRAPPER_FILE
            else
              echo "Error: gradle-wrapper.properties not found!"
            fi
      - run:
          name: Get Dependencies
          command: |
            export PATH="$PATH:$HOME/flutter/bin"
            flutter pub get
      - run:
          name: Build Release APK
          command: |
            export PATH="$PATH:$HOME/flutter/bin"
            flutter build apk --release --no-tree-shake-icons
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

workflows:
  build-workflow:
    jobs:
      - build-apk
