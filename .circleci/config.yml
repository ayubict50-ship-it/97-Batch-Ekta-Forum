version: 2.1

executors:
  flutter-executor:
docker:
  - image: ghcr.io/cirrusci/flutter:3.24.3

jobs:
  build-apk:
    executor: flutter-executor
    steps:
      - checkout
      - run:
          name: Get Dependencies
          command: flutter pub get
      - run:
          name: Build APK
          command: flutter build apk --release --no-tree-shake-icons
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

workflows:
  build-workflow:
    jobs:
      - build-apk