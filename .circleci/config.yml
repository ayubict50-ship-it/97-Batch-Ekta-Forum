version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: large
    steps:
      - checkout

      - run:
          name: Install Ninja and CMake for Native Build
          command: |
            sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - run:
          name: Install Flutter
          command: |
            git clone https://github.com/flutter/flutter.git -b stable ~/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter doctor

      - run:
          name: Setup Gradle Wrapper
          command: |
            # Build a throw-away project to generate a Gradle 8.14.2 wrapper
            WRAPPER_TMP=$(mktemp -d)
            cd "$WRAPPER_TMP"
            echo "rootProject.name = 'wrapper-gen'" > settings.gradle
            touch build.gradle
            gradle wrapper --gradle-version 8.14.2 --distribution-type bin

            # Install the wrapper files into the android project
            mkdir -p "$CIRCLE_WORKING_DIRECTORY/android/gradle/wrapper"
            cp gradlew "$CIRCLE_WORKING_DIRECTORY/android/gradlew"
            cp gradle/wrapper/gradle-wrapper.jar \
               "$CIRCLE_WORKING_DIRECTORY/android/gradle/wrapper/gradle-wrapper.jar"
            chmod +x "$CIRCLE_WORKING_DIRECTORY/android/gradlew"
            printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.2-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' \
              > "$CIRCLE_WORKING_DIRECTORY/android/gradle/wrapper/gradle-wrapper.properties"

      - run:
          name: Force Override AGP Version Everywhere
          command: |
            find . -name "build.gradle" -o -name "*.gradle" -o -name "*.kts" | while read file; do
              sed -i 's/8.4.0/8.9.1/g' "$file"
            done

      - run:
          name: Install Dependencies
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter clean
            flutter pub get

      - run:
          name: Build Release App Bundle
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter build appbundle --release --android-skip-build-dependency-validation

      - store_artifacts:
          path: build/app/outputs/bundle/release/
          destination: release-bundle

workflows:
  version: 2
  build:
    jobs:
      - build-apk
