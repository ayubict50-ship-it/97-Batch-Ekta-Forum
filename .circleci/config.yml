version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2023.08-node
    steps:
      - checkout
      - run:
          name: Install Specific Flutter Version
          command: |
            git clone https://github.com/flutter/flutter.git -b 3.24.0 --depth 1 ~/flutter
            echo 'export PATH="$PATH:$HOME/flutter/bin"' >> $BASH_ENV
            source $BASH_ENV
            flutter --version
      - run:
          name: Update Gradle Version
          command: |
            # Update gradle-wrapper.properties to version 8.6
            WRAPPER_FILE="android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$WRAPPER_FILE" ]; then
              sed -i 's/gradle-8.0-all.zip/gradle-8.6-all.zip/g' $WRAPPER_FILE
              sed -i 's/gradle-8.0-bin.zip/gradle-8.6-all.zip/g' $WRAPPER_FILE
              sed -i 's/gradle-7.[0-9]*-all.zip/gradle-8.6-all.zip/g' $WRAPPER_FILE
              cat $WRAPPER_FILE
            fi
      - run:
          name: Get Dependencies
          command: |
            export PATH="$PATH:$HOME/flutter/bin"
            flutter pub get
      - run:
          name: Build Release APK
          command: |
            export PATH="$PATH:$HOME/flutter/bin"
            flutter build apk --release --no-tree-shake-icons
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

workflows:
  build-workflow:
    jobs:
      - build-apk
