version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2023.08-node
    steps:
      - checkout
      - run:
          name: Install Specific Flutter Version
          command: |
            git clone https://github.com/flutter/flutter.git -b 3.24.0 --depth 1 ~/flutter
            echo 'export PATH="$PATH:$HOME/flutter/bin"' >> $BASH_ENV
            source $BASH_ENV
            flutter --version
      - run:
          name: Purge Cache and Force Gradle 8.6 Setup
          command: |
            rm -rf ~/.gradle/wrapper/dists/*
            
            WRAPPER_FILE="android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$WRAPPER_FILE" ]; then
              echo "Overwriting $WRAPPER_FILE with Gradle 8.6"
              echo "distributionBase=GRADLE_USER_HOME" > "$WRAPPER_FILE"
              echo "distributionPath=wrapper/dists" >> "$WRAPPER_FILE"
              echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-all.zip" >> "$WRAPPER_FILE"
              echo "networkTimeout=10000000" >> "$WRAPPER_FILE"
              echo "validateDistributionUrl=true" >> "$WRAPPER_FILE"
              echo "zipStoreBase=GRADLE_USER_HOME" >> "$WRAPPER_FILE"
              echo "zipStorePath=wrapper/dists" >> "$WRAPPER_FILE"
            else
              echo "Warning: $WRAPPER_FILE not found!"
            fi
      - run:
          name: Install Dependencies
          command: |
            flutter pub get
      - run:
          name: Build APK
          command: |
            flutter build apk --release --no-tree-shake-icons
      - store_artifacts:
            path: build/app/outputs/flutter-apk/app-release.apk
            destination: app-release.apk

workflows:
  build-workflow:
    jobs:
      - build-apk
