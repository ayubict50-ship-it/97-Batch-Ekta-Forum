version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: large
    steps:
      - checkout

      - run:
          name: Install Ninja and CMake for Native Build
          command: |
            sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - run:
          name: Install Flutter
          command: |
            git clone https://github.com/flutter/flutter.git -b stable ~/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter doctor

      - run:
          name: Configure Gradle Wrapper
          command: |
            mkdir -p android/gradle/wrapper
            echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.2-bin.zip" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

      - run:
          name: Force Override AGP Version Everywhere
          command: |
            find . -name "build.gradle" -o -name "*.gradle" -o -name "*.kts" | while read file; do
              sed -i 's/8.4.0/8.9.1/g' "$file"
            done

      - run:
          name: Install Dependencies
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter clean
            flutter pub get

      - run:
          name: Build APK Release
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter build apk --release --android-skip-build-dependency-validation
            
            # ফ্লাটারের সঠিক পাথ থেকে এপিকে ফাইল কপি করে নিশ্চিত করা
            mkdir -p build/app/outputs/flutter-apk/
            cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ || find . -name "app-release.apk" -exec cp {} build/app/outputs/flutter-apk/ \;
            ls -la build/app/outputs/flutter-apk/

      - store_artifacts:
          path: build/app/outputs/flutter-apk/
          destination: release-apk

workflows:
  version: 2
  build:
    jobs:
      - build-apk
