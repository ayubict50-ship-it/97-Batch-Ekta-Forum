version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: large
    steps:
      - checkout

      - run:
          name: Install Flutter
          command: |
            git clone https://github.com/flutter/flutter.git -b stable ~/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter doctor

      - run:
          name: Configure Gradle Wrapper
          command: |
            mkdir -p android/gradle/wrapper
            echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.2-bin.zip" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

      - run:
          name: Force Override AGP and Kotlin Version Everywhere
          command: |
            find . -name "build.gradle" -o -name "*.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" | while read file; do
              sed -i 's/8.4.0/8.11.1/g' "$file"
              sed -i 's/8.9.1/8.11.1/g' "$file"
              sed -i 's/2.0.0/2.2.0/g' "$file"
            done

      - run:
          name: Install Dependencies
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter clean
            flutter pub get

      - run:
          name: Build APK Release
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter build apk --release

      - store_artifacts:
          path: build/app/outputs/flutter-apk/
          destination: release-apk

workflows:
  version: 2
  build:
    jobs:
      - build-apk
