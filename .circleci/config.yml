
version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: large

    steps:
      - checkout

      - run:
          name: Install Native Build Tools
          command: |
            sudo apt-get update
            sudo apt-get install -y ninja-build cmake

      - run:
          name: Install Flutter
          command: |
            git clone https://github.com/flutter/flutter.git -b stable ~/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter doctor

      - run:
          name: Generate Gradle 8.14.2 Wrapper
          command: |
            mkdir -p "$HOME/wrapper-generator"
            cd "$HOME/wrapper-generator"

            echo "rootProject.name='wrapper-generator'" > settings.gradle
            echo "plugins { id 'base' }" > build.gradle

            gradle wrapper --gradle-version 8.14.2 --distribution-type bin

            cd "$CIRCLE_WORKING_DIRECTORY"

            mkdir -p android/gradle/wrapper

            cp "$HOME/wrapper-generator/gradlew" android/
            cp "$HOME/wrapper-generator/gradlew.bat" android/
            cp "$HOME/wrapper-generator/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/

            cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
            distributionBase=GRADLE_USER_HOME
            distributionPath=wrapper/dists
            distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.2-bin.zip
            zipStoreBase=GRADLE_USER_HOME
            zipStorePath=wrapper/dists
            EOF

            chmod +x android/gradlew

            cd android
            ./gradlew --version

      - run:
          name: Install Dependencies
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter clean
            flutter pub get

      - run:
          name: Build App Bundle Release
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter build appbundle --release

      - store_artifacts:
          path: build/app/outputs/bundle/release/
          destination: release-bundle

workflows:
  version: 2
  build:
    jobs:
      - build-apk
