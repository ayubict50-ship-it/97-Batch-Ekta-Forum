version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: large
    steps:
      - checkout

      - run:
          name: Install Ninja and CMake for Native Build
          command: |
            sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - run:
          name: Install Flutter
          command: |
            git clone https://github.com/flutter/flutter.git -b stable ~/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter doctor

      - run:
          name: Configure Gradle Wrapper Properties
          command: |
            mkdir -p android/gradle/wrapper
            printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.2-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > android/gradle/wrapper/gradle-wrapper.properties

      - run:
          name: Force Override AGP Version Everywhere
          command: |
            find . -name "build.gradle" -o -name "*.gradle" -o -name "*.kts" | while read file; do
              sed -i 's/8.4.0/8.9.1/g' "$file"
            done

      - run:
          name: Install Dependencies and Generate Wrapper
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter clean
            flutter pub get
            cd android
            gradle wrapper --gradle-version 8.14.2
            chmod +x gradlew
            cd ..

      - run:
          name: Build Release App Bundle
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter build appbundle --release --android-skip-build-dependency-validation

      - store_artifacts:
          path: build/app/outputs/bundle/release/
          destination: release-bundle

workflows:
  version: 2
  build:
    jobs:
      - build-apk
