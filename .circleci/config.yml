version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/android:2024.04-node
    resource_class: large
    steps:
      - checkout

      - run:
          name: Install Ninja and CMake for Native Build
          command: |
            sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - run:
          name: Install Flutter
          command: |
            git clone https://github.com/flutter/flutter.git -b stable ~/flutter
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            flutter doctor

      - run:
          name: Clear Gradle Cache Completely and Upgrade Gradle to 8.11.1
          command: |
            rm -rf ~/.gradle/caches/
            rm -rf ~/.android/cache/
            mkdir -p android/gradle/wrapper
            echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

      - run:
          name: Deep Force Override AGP to 8.9.1 across all project files
          command: |
            python3 -c '
            import os
            import re

            target_version = "8.9.1"
            
            for root, dirs, files in os.walk("."):
                if ".git" in root or "flutter" in root:
                    continue
                for file in files:
                    if file == "build.gradle" or file == "gradle.properties" or file.endswith(".gradle"):
                        file_path = os.path.join(root, file)
                        try:
                            with open(file_path, "r", encoding="utf-8") as f:
                                content = f.read()
                            
                            updated = False
                            if "com.android.tools.build:gradle" in content:
                                content = re.sub(r"com\.android\.tools\.build:gradle:[^'\''\" ]+", f"com.android.tools.build:gradle:{target_version}", content)
                                updated = True
                                
                            if "8.4.0" in content:
                                content = content.replace("8.4.0", target_version)
                                updated = True

                            if updated:
                                with open(file_path, "w", encoding="utf-8") as f:
                                    f.write(content)
                        except Exception as e:
                            pass
            '

      - run:
          name: Install Dependencies
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter pub get
            flutter clean

      - run:
          name: Build APK Release
          command: |
            export PATH="$HOME/flutter/bin:$PATH"
            flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation || true
            
            # প্রজেক্টের যেকোনো জায়গা থেকে রিলিজ এপিকে খুঁজে বের করে সঠিক আর্টifacts ফোল্ডারে কপি করা
            mkdir -p build/app/outputs/flutter-apk/
            find . -name "app-release.apk" -exec cp {} build/app/outputs/flutter-apk/ \;
            ls -la build/app/outputs/flutter-apk/

      - store_artifacts:
          path: build/app/outputs/flutter-apk/
          destination: release-apk

workflows:
  version: 2
  build:
    jobs:
      - build-apk
      
