workflows:
  android-workflow:
    name: Android Workflow
    environment:
      flutter: 3.22.2
      java: 17
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
