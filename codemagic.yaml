workflows:
  android-workflow:
    name: Android Workflow
    environment:
      flutter: 3.24.3
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > android/local.properties
      - name: Clean and Get packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK & AppBundle
        script: |
          flutter build appbundle --release --no-tree-shake-icons
          flutter build apk --release --no-tree-shake-icons
          mkdir -p build/app/outputs/bundle/release/
          mkdir -p build/app/outputs/flutter-apk/
          find build/ -name "*.aab" -exec cp {} build/app/outputs/bundle/release/ \;
          find build/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \;
artifacts:
  publishing:
    email:
      recipients:
        - ayubict50@gmail.com
  build/app/outputs/bundle/release/*.aab
  build/app/outputs/flutter-apk/*.apk
