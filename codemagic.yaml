workflows:
_  android-workflow:
    name: Android Workflow
    environment:
      flutter: 3.24.3
      java: 17
    scripts:
      - name: Clean and Get packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
