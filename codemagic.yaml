workflows:
  android-workflow:
    name: Android Workflow
    environment:
      flutter: 3.24.3
      java: 17
    scripts:
      - name: Clean and Get packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/apk/release/*.apk
